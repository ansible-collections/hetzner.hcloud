---
- name: Create test_primary_ipv4
  hetzner.hcloud.primary_ip:
    name: "{{ hcloud_primary_ipv4_name }}"
    type: ipv4
    location: "{{ hcloud_location_name }}"
  register: test_primary_ipv4

- name: Create test_primary_ipv6
  hetzner.hcloud.primary_ip:
    name: "{{ hcloud_primary_ipv6_name }}"
    type: ipv6
    location: "{{ hcloud_location_name }}"
  register: test_primary_ipv6

- name: Create test_primary_ipv6_alt
  hetzner.hcloud.primary_ip:
    name: "{{ hcloud_primary_ipv6_alt_name }}"
    type: ipv6
    location: "{{ hcloud_location_name }}"
  register: test_primary_ipv6_alt
